# Netlify — Florence public demo frontend (Vite)
# Build env (set in Netlify UI, not here):
#   VITE_PUBLIC_DEMO=true
#   VITE_API_BASE_URL=https://<your-render-service>.onrender.com

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
